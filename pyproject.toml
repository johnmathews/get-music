[project]
name = "gm"
version = "0.1.0"
description = "CLI tool for adding music to a Navidrome instance"
requires-python = ">=3.13"
dependencies = ["mutagen>=1.47"]

[project.scripts]
gm = "gm.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "coverage>=7.0", "pytest-cov>=5.0", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["gm"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ", "BLE", "PL", "RUF", "S110"]
ignore = ["PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
# PLC0415: tests deliberately import lazily inside test functions
"tests/*" = ["S", "PLR", "PLC0415"]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["gm"]
# mutagen ships py.typed but re-exports File/FileType/MutagenError from
# private modules without an __all__, so pyright wrongly flags its public API.
reportPrivateImportUsage = false
